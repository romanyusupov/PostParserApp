<nav class="app-navigation" aria-label="Разделы приложения">
  <div
    id="parentTabList"
    class="parent-tabs"
    role="tablist"
    aria-label="Основные разделы"
  >
    <a
      id="settingsParentTab"
      class="parent-tab{% if active_section == 'settings' %} is-active{% endif %}"
      href="/shadow/settings"
      role="tab"
      aria-selected="{{ 'true' if active_section == 'settings' else 'false' }}"
      aria-controls="settingsPanel"
      tabindex="{{ '0' if active_section == 'settings' else '-1' }}"
    >Настройки</a>
    <a
      id="resultsParentTab"
      class="parent-tab{% if active_section == 'results' %} is-active{% endif %}"
      href="/results"
      role="tab"
      aria-selected="{{ 'true' if active_section == 'results' else 'false' }}"
      aria-controls="resultsPanel"
      tabindex="{{ '0' if active_section == 'results' else '-1' }}"
    >Результаты</a>
    {% if authenticated_is_admin %}
    <a
      id="accessParentTab"
      class="parent-tab{% if active_section == 'access' %} is-active{% endif %}"
      href="/admin/access"
      role="tab"
      aria-selected="{{ 'true' if active_section == 'access' else 'false' }}"
      aria-controls="accessPanel"
      tabindex="{{ '0' if active_section == 'access' else '-1' }}"
    >Дать доступ</a>
    {% endif %}
  </div>
  <div class="session-controls">
    <span class="session-user">{{ authenticated_user.name }}</span>
    <form action="/logout" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="session-logout" type="submit">Выйти</button>
    </form>
  </div>
  {% if active_section != 'access' %}
  <div class="group-tabs-scroll">
    <div
      id="groupTabs"
      class="group-tabs"
      role="tablist"
      aria-label="Группы"
    ></div>
  </div>
  {% endif %}
</nav>
