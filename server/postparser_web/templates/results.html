<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Результаты парсинга</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='settings.css') }}"
    >
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='results.css') }}"
    >
    <script
      src="{{ url_for('static', filename='results_logic.js') }}"
      defer
    ></script>
    <script
      src="{{ url_for('static', filename='results.js') }}"
      defer
    ></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div>
          <div class="eyebrow">Shadow-интерфейс</div>
          <h1>Результаты парсинга</h1>
          <p class="page-description">
            Выберите запуск, чтобы посмотреть сохранённые публикации.
          </p>
        </div>
        <a class="button button-ghost page-link" href="/shadow/settings">
          Настройки
        </a>
      </header>

      <div id="statusMessage" class="status status-info" role="status" aria-live="polite">
        Загружаем запуски…
      </div>

      <section class="results-section" aria-labelledby="runsTitle">
        <h2 id="runsTitle">Запуски</h2>
        <div class="table-card">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col">Группа</th>
                  <th scope="col">Сеть</th>
                  <th scope="col">Дата</th>
                  <th scope="col">Статус</th>
                  <th scope="col">Количество</th>
                  <th scope="col"><span class="visually-hidden">Действие</span></th>
                </tr>
              </thead>
              <tbody id="runsTableBody"></tbody>
            </table>
          </div>
          <p id="runsEmptyState" class="table-empty" hidden>
            Запусков пока нет.
          </p>
        </div>
      </section>

      <section
        id="postsSection"
        class="results-section"
        aria-labelledby="postsTitle"
        hidden
      >
        <div class="toolbar">
          <div>
            <h2 id="postsTitle">Публикации</h2>
            <p id="selectedRunDescription" class="section-description"></p>
          </div>
          <button
            id="exportGoogleSheetsButton"
            class="button button-primary"
            type="button"
            hidden
          >
            Экспортировать в Google Sheets
          </button>
        </div>
        <div
          id="exportResult"
          class="status"
          role="status"
          aria-live="polite"
          hidden
        ></div>
        <div class="table-card">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col">Дата</th>
                  <th scope="col">Публикация</th>
                  <th scope="col">Текст</th>
                  <th scope="col">Тип</th>
                  <th
                    class="metric-header"
                    scope="col"
                    data-sort-header="views"
                    aria-sort="none"
                  >
                    <button
                      class="sort-button"
                      type="button"
                      data-sort-field="views"
                      aria-label="Сортировать по просмотрам по убыванию"
                      title="Сортировать по просмотрам по убыванию"
                    >
                      <span>Просмотры</span>
                      <span class="sort-indicator" aria-hidden="true"></span>
                    </button>
                  </th>
                  <th
                    class="metric-header"
                    scope="col"
                    data-sort-header="likes"
                    aria-sort="none"
                  >
                    <button
                      class="sort-button"
                      type="button"
                      data-sort-field="likes"
                      aria-label="Сортировать по лайкам по убыванию"
                      title="Сортировать по лайкам по убыванию"
                    >
                      <span>Лайки</span>
                      <span class="sort-indicator" aria-hidden="true"></span>
                    </button>
                  </th>
                  <th
                    class="metric-header"
                    scope="col"
                    data-sort-header="comments"
                    aria-sort="none"
                  >
                    <button
                      class="sort-button"
                      type="button"
                      data-sort-field="comments"
                      aria-label="Сортировать по комментариям по убыванию"
                      title="Сортировать по комментариям по убыванию"
                    >
                      <span>Комментарии</span>
                      <span class="sort-indicator" aria-hidden="true"></span>
                    </button>
                  </th>
                </tr>
              </thead>
              <tbody id="postsTableBody"></tbody>
            </table>
          </div>
          <p id="postsEmptyState" class="table-empty" hidden>
            В этом запуске нет публикаций.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
