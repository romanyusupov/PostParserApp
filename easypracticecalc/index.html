<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#281509">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Калькулятор">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>Калькулятор практик</title>
<style>
*{box-sizing:border-box}
html{background:#281509}
body{
  margin:0;
  min-height:100vh;
  padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
          calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  background:#281509;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.card{max-width:900px;margin:auto;background:#3b2415;border-radius:20px;padding:30px}
.parameter-toggle{display:none}
.parameter-panel{display:block}
.tabs{display:flex;gap:10px;margin-bottom:25px}
.tab{
  padding:14px 25px;border-radius:12px;border:1px solid #d28a40;cursor:pointer;
  color:#f0b56d;-webkit-tap-highlight-color:transparent;user-select:none
}
.tab.active{background:#e7a04d;color:#251307}
.panel{display:none}
.panel.active{display:block}
.controls{display:flex;gap:20px;flex-wrap:wrap}
.controls>div{flex:1 1 260px}
label{display:block;color:#e7aa61;margin-bottom:8px}
select{
  width:100%;background:#25150b;color:white;border:1px solid #d28a40;border-radius:12px;
  padding:14px;min-width:0;font-size:16px
}
.result{
  margin-top:25px;background:#eca54e;color:#251307;border-radius:15px;padding:20px;
  font-size:24px;font-weight:700;line-height:1.35
}
.timer-card{
  margin-top:28px;padding:24px;border:1px solid rgba(231,160,77,.45);border-radius:18px;
  background:#321d10;text-align:center
}
.timer-heading{margin:0 0 3px;color:#f0b56d;font-size:17px;font-weight:600}
.timer-status{min-height:24px;margin:0 0 14px;color:#f4d4ae;font-size:15px}
.timer-circle{position:relative;width:220px;height:220px;margin:0 auto}
.timer-circle svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-track,.timer-progress{fill:none;stroke-width:12}
.timer-track{stroke:rgba(255,255,255,.12)}
.timer-progress{stroke:#eca54e;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.timer-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.timer-time{font-size:32px;font-weight:750;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.timer-cumulative{margin:12px 0 0;color:#f4d4ae;font-size:15px;font-variant-numeric:tabular-nums}
.timer-cumulative strong{color:#eca54e}
.timer-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
.timer-button{
  min-width:118px;border:1px solid #d28a40;border-radius:12px;padding:12px 18px;
  background:#eca54e;color:#251307;font:inherit;font-weight:700;cursor:pointer
}
.timer-button.secondary{background:transparent;color:#f0b56d}
.timer-button:disabled{opacity:.72;cursor:not-allowed}
.timer-button[hidden]{display:none}
.next-segment-button{width:100%;margin-top:13px;background:#5a341c;color:#f4d4ae}
.next-segment-button:not(.secondary){background:#eca54e;color:#251307}
.segment-history{margin-top:28px;padding-top:22px;border-top:1px solid rgba(231,160,77,.32);text-align:left}
.segment-history[hidden]{display:none}
.segment-history h3{margin:0 0 12px;color:#f0b56d;font-size:17px}
.segment-list{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.segment-item{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:12px;background:#281509;color:#f4d4ae;font-size:14px;line-height:1.4}
.segment-check{margin-left:auto;color:#eca54e;font-size:19px;font-weight:800}
select:disabled{opacity:.72;cursor:not-allowed}
.tab.locked{opacity:.72;cursor:not-allowed}
.segment-warning[hidden]{display:none}
.segment-warning{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:20px;background:rgba(18,8,3,.72)}
.segment-warning-card{width:min(440px,100%);padding:24px;border:1px solid #d28a40;border-radius:18px;background:#3b2415;box-shadow:0 18px 50px rgba(0,0,0,.42);text-align:center}
.segment-warning-card p{margin:0 0 18px;color:#fff;font-size:17px;line-height:1.45}
.layer-progress{width:100%;margin-top:27px;padding:3px 34px 24px 0}
.layer-scale{position:relative;width:100%}
.layer-track{position:absolute;top:15px;left:0;width:100%;height:5px;border-radius:999px;background:#775136;overflow:hidden}
.layer-fill{width:0;height:100%;border-radius:inherit;background:#eca54e;transition:width .25s linear}
.layer-markers{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%}
.layer-step{position:relative;height:54px;color:#b8977d;font-size:13px}
.layer-marker{
  position:absolute;top:0;right:0;transform:translateX(50%);display:grid;width:34px;height:34px;
  place-items:center;border:2px solid #775136;border-radius:50%;background:#321d10;font-weight:750;
  transition:border-color .2s,background .2s,color .2s,box-shadow .2s
}
.layer-label{position:absolute;top:40px;right:0;transform:translateX(50%);white-space:nowrap}
.layer-label-short{display:none}
.layer-step.current{color:#f4d4ae}.layer-step.current .layer-marker{border-color:#eca54e;color:#eca54e}
.layer-step.complete{color:#f0b56d}.layer-step.complete .layer-marker{border-color:#eca54e;background:#eca54e;color:#251307}
.layer-step.target .layer-marker{box-shadow:0 0 0 3px #f4d4ae}
@media(max-width:600px){
  body{padding-top:max(8px,env(safe-area-inset-top));padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .card{padding:12px;border-radius:18px}
  .parameter-toggle{
    display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;
    padding:10px 13px;border:1px solid #d28a40;border-radius:12px;background:#321d10;color:#fff;
    font:inherit;text-align:left;cursor:pointer
  }
  .parameter-toggle-label{color:#f0b56d;font-weight:750}
  .parameter-summary{min-width:0;overflow:hidden;color:#f4d4ae;font-size:14px;text-overflow:ellipsis;white-space:nowrap}
  .parameters.mobile-collapsed .parameter-panel{display:none}
  .parameter-panel{padding-top:12px}
  .tabs{gap:8px}
  .tab{flex:1;text-align:center;padding:11px 8px;font-size:15px}
  .controls{gap:14px}
  .result{margin-top:14px;padding:14px;font-size:19px}
  .timer-card{margin-top:10px;padding:12px 8px}
  .timer-heading{font-size:16px}
  .timer-status{margin-bottom:8px}
  .timer-circle{width:190px;height:190px}
  .timer-time{font-size:27px}
  .timer-cumulative{margin-top:7px}
  .timer-actions{margin-top:11px}
  .timer-button{min-width:100px;flex:1 1 120px}
  .next-segment-button{flex-basis:100%;margin-top:9px}
  .segment-history{margin-top:18px;padding-top:16px}
  .segment-item{align-items:center;font-size:13px}
  .segment-item>span:first-child{min-width:0;overflow-wrap:anywhere}
  .layer-progress{margin-top:18px;padding-right:24px;padding-bottom:20px}
  .layer-label-full{display:none}
  .layer-label-short{display:inline}
}
</style>
</head>
<body>
<div class="card">
  <section class="parameters" id="practiceParameters">
    <button class="parameter-toggle" id="parameterToggle" type="button"
            aria-expanded="true" aria-controls="parameterPanel">
      <span class="parameter-toggle-label">Параметры</span>
      <span class="parameter-summary" id="parameterSummary"></span>
    </button>
    <div class="parameter-panel" id="parameterPanel">
      <div class="tabs">
        <div class="tab active" data-practice="water" onclick="openTab('water',this)">Вода</div>
        <div class="tab" data-practice="move" onclick="openTab('move',this)">Ходьба/бег</div>
      </div>

      <div id="water" class="panel active">
        <div class="controls">
          <div><label>Дополнительные слои</label><select id="waterLayer"></select></div>
          <div><label>Температура воды</label><select id="waterTemp"></select></div>
        </div>
        <div class="result" id="waterResult"></div>
      </div>

      <div id="move" class="panel">
        <div class="controls">
          <div><label>Дополнительные слои</label><select id="moveLayer"></select></div>
          <div><label>Скорость движения</label><select id="moveSpeed"></select></div>
        </div>
        <div class="result" id="moveResult"></div>
      </div>
    </div>
  </section>

  <section class="timer-card" id="timerCard" aria-labelledby="timerPractice">
    <h2 class="timer-heading" id="timerPractice">Вода</h2>
    <p class="timer-status" id="timerStatus" aria-live="polite">Готово к запуску</p>
    <div class="timer-circle">
      <svg viewBox="0 0 220 220" aria-hidden="true">
        <circle class="timer-track" cx="110" cy="110" r="94"></circle>
        <circle class="timer-progress" id="timerProgress" cx="110" cy="110" r="94"></circle>
      </svg>
      <div class="timer-center"><time class="timer-time" id="timerTime">00:00:00</time></div>
    </div>
    <p class="timer-cumulative">Суммарное время: <strong id="timerCumulative">00:00:00</strong></p>
    <div class="timer-actions">
      <button class="timer-button" id="timerStart" type="button">Начать отрезок 1</button>
      <button class="timer-button" id="timerPause" type="button" hidden>Пауза</button>
      <button class="timer-button" id="timerResume" type="button" hidden>Продолжить</button>
      <button class="timer-button secondary" id="timerReset" type="button" hidden>Сбросить</button>
    </div>
    <button class="timer-button next-segment-button" id="timerNext" type="button" hidden>+ Следующий отрезок</button>
    <div class="layer-progress" id="layerProgress" role="progressbar"
         aria-label="Глубина прохождения практики по пяти слоям"
         aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"></div>
    <section class="segment-history" id="segmentHistory" hidden>
      <h3>Отрезки тренировки</h3>
      <ol class="segment-list" id="segmentList"></ol>
    </section>
  </section>
</div>

<div class="segment-warning" id="segmentWarning" role="alertdialog" aria-modal="true"
     aria-labelledby="segmentWarningText" hidden>
  <div class="segment-warning-card">
    <p id="segmentWarningText">Чтобы начать следующий отрезок, завершите текущий с теми же параметрами.</p>
    <button class="timer-button" id="segmentWarningClose" type="button">Понятно</button>
  </div>
</div>

function openTab(id,el){
  if(window.easyTimerController && !window.easyTimerController.canConfigure()){
    window.easyTimerController.showLockedWarning();
    return;
  }
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}

function fill(){
  for(let t=28;t>=4;t--) waterTemp.innerHTML+=`<option value="${t}">${t} °C</option>`;
  for(let i=1;i<=5;i++){
    waterLayer.innerHTML+=`<option value="${i}">${i} слой</option>`;
    moveLayer.innerHTML+=`<option value="${i}">${i} слой</option>`;
  }
  Object.keys(moveData).forEach(s=>{
    let pace=60/Number(s), m=Math.floor(pace), sec=Math.round((pace-m)*60);
    moveSpeed.innerHTML+=`<option value="${s}">${s} км/ч · ${sec?m+' мин '+sec+' сек/км':m+' мин/км'}</option>`;
  });
}

function ft(t){
  let s=Math.round(t*60),m=Math.floor(s/60),sec=s%60;
  return sec?m+' мин '+sec+' сек':m+' мин';
}

function updateWater(){
  waterResult.innerHTML='Время: '+ft(waterData[waterTemp.value][waterLayer.value]);
}
function updateMove(){
  let t=moveData[moveSpeed.value][moveLayer.value];
  let d=Number(moveSpeed.value)*t/60;
  moveResult.innerHTML='Время: '+ft(t)+'<br>Дистанция: '+d.toFixed(3)+' км';
}

waterTemp.onchange=updateWater;
waterLayer.onchange=updateWater;
moveSpeed.onchange=updateMove;
moveLayer.onchange=updateMove;
