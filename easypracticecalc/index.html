<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#281509">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Калькулятор">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>Калькулятор практик</title>
<style>
*{box-sizing:border-box}
html{background:#281509}
body{
  margin:0;
  min-height:100vh;
  padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
          calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  background:#281509;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.card{max-width:900px;margin:auto;background:#3b2415;border-radius:20px;padding:30px}
.tabs{display:flex;gap:10px;margin-bottom:25px}
.tab{
  padding:14px 25px;border-radius:12px;border:1px solid #d28a40;cursor:pointer;
  color:#f0b56d;-webkit-tap-highlight-color:transparent;user-select:none
}
.tab.active{background:#e7a04d;color:#251307}
.panel{display:none}
.panel.active{display:block}
.controls{display:flex;gap:20px;flex-wrap:wrap}
.controls>div{flex:1 1 260px}
label{display:block;color:#e7aa61;margin-bottom:8px}
select{
  width:100%;background:#25150b;color:white;border:1px solid #d28a40;border-radius:12px;
  padding:14px;min-width:0;font-size:16px
}
.result{
  margin-top:25px;background:#eca54e;color:#251307;border-radius:15px;padding:20px;
  font-size:24px;font-weight:700;line-height:1.35
}
.timer-card{
  margin-top:28px;padding:24px;border:1px solid rgba(231,160,77,.45);border-radius:18px;
  background:#321d10;text-align:center
}
.timer-heading{margin:0 0 3px;color:#f0b56d;font-size:17px;font-weight:600}
.timer-status{min-height:24px;margin:0 0 14px;color:#f4d4ae;font-size:15px}
.timer-circle{position:relative;width:220px;height:220px;margin:0 auto}
.timer-circle svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-track,.timer-progress{fill:none;stroke-width:12}
.timer-track{stroke:rgba(255,255,255,.12)}
.timer-progress{stroke:#eca54e;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.timer-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.timer-time{font-size:32px;font-weight:750;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.timer-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
.timer-button{
  min-width:118px;border:1px solid #d28a40;border-radius:12px;padding:12px 18px;
  background:#eca54e;color:#251307;font:inherit;font-weight:700;cursor:pointer
}
.timer-button.secondary{background:transparent;color:#f0b56d}
.timer-button[hidden]{display:none}
.layer-progress{display:flex;justify-content:center;gap:9px;margin-top:25px;overflow-x:auto;padding:3px}
.layer-step{display:flex;min-width:70px;flex-direction:column;align-items:center;gap:6px;color:#b8977d;font-size:13px}
.layer-marker{display:grid;width:34px;height:34px;place-items:center;border:2px solid #775136;border-radius:50%;font-weight:750}
.layer-step.current{color:#f4d4ae}.layer-step.current .layer-marker{border-color:#eca54e;background:#eca54e;color:#251307}
.layer-step.complete{color:#f0b56d}.layer-step.complete .layer-marker{border-color:#d28a40;background:#5a341c}
@media(max-width:600px){
  body{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .card{padding:20px 16px;border-radius:18px}
  .tabs{gap:8px}
  .tab{flex:1;text-align:center;padding:13px 8px;font-size:15px}
  .controls{gap:14px}
  .result{font-size:21px}
  .timer-card{padding:20px 10px}
  .timer-circle{width:190px;height:190px}
  .timer-time{font-size:27px}
  .timer-button{min-width:100px;flex:1 1 120px}
  .layer-progress{justify-content:flex-start}
}
</style>
</head>
<body>
<div class="card">
  <div class="tabs">
    <div class="tab active" data-practice="water" onclick="openTab('water',this)">Вода</div>
    <div class="tab" data-practice="move" onclick="openTab('move',this)">Ходьба/бег</div>
  </div>

  <div id="water" class="panel active">
    <div class="controls">
      <div><label>Количество слоев</label><select id="waterLayer"></select></div>
      <div><label>Температура воды</label><select id="waterTemp"></select></div>
    </div>
    <div class="result" id="waterResult"></div>
  </div>

  <div id="move" class="panel">
    <div class="controls">
      <div><label>Количество слоев</label><select id="moveLayer"></select></div>
      <div><label>Скорость движения</label><select id="moveSpeed"></select></div>
    </div>
    <div class="result" id="moveResult"></div>
  </div>

  <section class="timer-card" id="timerCard" aria-labelledby="timerPractice">
    <h2 class="timer-heading" id="timerPractice">Вода</h2>
    <p class="timer-status" id="timerStatus" aria-live="polite">Готово к запуску</p>
    <div class="timer-circle">
      <svg viewBox="0 0 220 220" aria-hidden="true">
        <circle class="timer-track" cx="110" cy="110" r="94"></circle>
        <circle class="timer-progress" id="timerProgress" cx="110" cy="110" r="94"></circle>
      </svg>
      <div class="timer-center"><time class="timer-time" id="timerTime">00:00:00</time></div>
    </div>
    <div class="timer-actions">
      <button class="timer-button" id="timerStart" type="button">Начать</button>
      <button class="timer-button" id="timerPause" type="button" hidden>Пауза</button>
      <button class="timer-button" id="timerResume" type="button" hidden>Продолжить</button>
      <button class="timer-button secondary" id="timerReset" type="button" hidden>Сбросить</button>
    </div>
    <div class="layer-progress" id="layerProgress" aria-label="Прогресс по слоям"></div>
  </section>
</div>

function openTab(id,el){
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}

function fill(){
  for(let t=28;t>=4;t--) waterTemp.innerHTML+=`<option value="${t}">${t} °C</option>`;
  for(let i=1;i<=5;i++){
    waterLayer.innerHTML+=`<option value="${i}">${i} слой</option>`;
    moveLayer.innerHTML+=`<option value="${i}">${i} слой</option>`;
  }
  Object.keys(moveData).forEach(s=>{
    let pace=60/Number(s), m=Math.floor(pace), sec=Math.round((pace-m)*60);
    moveSpeed.innerHTML+=`<option value="${s}">${s} км/ч · ${sec?m+' мин '+sec+' сек/км':m+' мин/км'}</option>`;
  });
}

function ft(t){
  let s=Math.round(t*60),m=Math.floor(s/60),sec=s%60;
  return sec?m+' мин '+sec+' сек':m+' мин';
}

function updateWater(){
  waterResult.innerHTML='Время: '+ft(waterData[waterTemp.value][waterLayer.value]);
}
function updateMove(){
  let t=moveData[moveSpeed.value][moveLayer.value];
  let d=Number(moveSpeed.value)*t/60;
  moveResult.innerHTML='Время: '+ft(t)+'<br>Дистанция: '+d.toFixed(3)+' км';
}

waterTemp.onchange=updateWater;
waterLayer.onchange=updateWater;
moveSpeed.onchange=updateMove;
moveLayer.onchange=updateMove;
