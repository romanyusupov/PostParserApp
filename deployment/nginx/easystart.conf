# Add these locations to the HTTPS server block for
# tg-parser.proactivum.ru before the existing `location /` proxy.

location = /easystart {
    alias /opt/postparser-prod/easystart/index.html;
    default_type text/html;
}

location ^~ /easystart/ {
    alias /opt/postparser-prod/easystart/;
    index index.html;
    autoindex off;
}
