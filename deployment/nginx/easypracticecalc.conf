# Add these locations to the HTTPS server block for
# tg-parser.proactivum.ru before the existing `location /` proxy.

location = /easypracticecalc {
    return 308 /easypracticecalc/;
}

location = /easypracticecalc/sw.js {
    alias /opt/postparser-prod/easypracticecalc/sw.js;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/easypracticecalc/" always;
}

location = /easypracticecalc/manifest.webmanifest {
    alias /opt/postparser-prod/easypracticecalc/manifest.webmanifest;
    default_type application/manifest+json;
}

location ^~ /easypracticecalc/ {
    alias /opt/postparser-prod/easypracticecalc/;
    index index.html;
    autoindex off;
}
